server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_label_loki_job]
        regex: quanttrad
        action: keep
      - source_labels: [__meta_docker_container_label_loki_job]
        target_label: job
        action: replace
      - source_labels: [__meta_docker_container_label_loki_service]
        target_label: service
      - source_labels: [__meta_docker_container_label_quanttrad_runtime]
        target_label: runtime
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: compose_service
      - action: labeldrop
        regex: __meta_docker_container_label_(.+)
      - action: labeldrop
        regex: __meta_docker_container_(id|image|name)

  - job_name: host-capacity
    static_configs:
      - targets: [localhost]
        labels:
          job: quanttrad
          service: host-capacity
          compose_service: host-capacity
          __path__: /var/log/quanttrad-host-capacity/host-capacity-*.ndjson
    pipeline_stages:
      - json:
          expressions:
            observed_at: observed_at
      - timestamp:
          source: observed_at
          format: RFC3339Nano
