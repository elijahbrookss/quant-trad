apiVersion: 1

contactPoints:
  - orgId: 1
    name: qt-operator-email
    receivers:
      - uid: qt-operator-email
        type: email
        disableResolveMessage: false
        settings:
          addresses: $QT_ALERT_EMAILS
          singleEmail: false

policies:
  - orgId: 1
    receiver: qt-operator-email
    group_by:
      - grafana_folder
      - alertname
      - severity
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
