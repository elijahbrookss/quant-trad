services:
  grafana:
    environment:
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${QT_ALERT_SMTP_HOST:?QT_ALERT_SMTP_HOST must be set when QT_ALERTS_ENABLED=true}"
      GF_SMTP_USER: "${QT_ALERT_SMTP_USER:?QT_ALERT_SMTP_USER must be set when QT_ALERTS_ENABLED=true}"
      GF_SMTP_PASSWORD: "${QT_ALERT_SMTP_PASSWORD:?QT_ALERT_SMTP_PASSWORD must be set when QT_ALERTS_ENABLED=true}"
      GF_SMTP_FROM_ADDRESS: "${QT_ALERT_EMAIL_FROM:?QT_ALERT_EMAIL_FROM must be set when QT_ALERTS_ENABLED=true}"
      GF_SMTP_FROM_NAME: "${QT_ALERT_EMAIL_FROM_NAME:-Quant-Trad Alerts}"
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      GF_SMTP_SKIP_VERIFY: "false"
    volumes:
      - type: bind
        source: ./grafana/server-alerting/operator-email.yml
        target: /etc/grafana/provisioning/alerting/operator-email.yml
        read_only: true
        bind:
          create_host_path: false
