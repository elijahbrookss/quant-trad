# Disposable end-to-end storage fixture. No host paths, ports or credentials.
services:
  timescaledb:
    environment:
      PGDATA: /qt-source/pgdata
    volumes:
      - storage-demo-source:/qt-source
      - storage-demo-history:/qt-history
  test:
    # Use production code/dependencies/tools; only test fixtures are added.
    build:
      dockerfile: portal/backend/Dockerfile
      target: storage-test
    # PostgreSQL in the pinned Alpine image runs as UID 70. Sharing its PID
    # namespace and UID lets the real verifier inspect /proc/PID/root without
    # privileged mode or substituting filesystem evidence.
    user: "70:70"
    pid: "service:timescaledb"
    environment:
      QT_STORAGE_DEMO: "1"
    volumes:
      - storage-demo-source:/qt-source
      - storage-demo-history:/qt-history
volumes:
  storage-demo-source:
  storage-demo-history:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=268435456,uid=70,gid=70,mode=0700"
