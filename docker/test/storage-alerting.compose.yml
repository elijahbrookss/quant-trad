services:
  alloy-config-check:
    image: grafana/alloy:v1.18.1
    command: [validate, /etc/alloy/config.alloy]
    network_mode: none
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro

  alloy-clock-test:
    image: grafana/alloy:v1.18.1
    command: [run, --disable-reporting, /etc/alloy/clock-config.alloy]
    depends_on:
      - loki
    volumes:
      - ${QT_CLOCK_ALERT_TEST_CONFIG:?test config required}:/etc/alloy/clock-config.alloy:ro
      - ${QT_CLOCK_ALERT_TEST_EXPORT_ROOT:?synthetic export required}:/run/qt-clock-health:ro

  loki:
    image: grafana/loki:3.7.6
    # Synthetic 24h-old samples have just arrived and are still in the ingester.
    command:
      - -config.file=/etc/loki/server-config.yml
      - -querier.query-ingesters-within=48h
      - -ingester.query-store-max-look-back-period=48h
    ports:
      - "127.0.0.1::3100"
    volumes:
      - ../loki/server-config.yml:/etc/loki/server-config.yml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:13.2.0
    depends_on:
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: storage-test-only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SMTP_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    ports:
      - "127.0.0.1::3000"
    # Preserve SQLite across enable/disable/re-enable container recreation.
    # This unique project's named volume is destroyed in the proof's finally.
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/provisioning/datasources/loki.yml:/etc/grafana/provisioning/datasources/loki.yml:ro
      - ../grafana/provisioning/alerting/storage-safety.yml:/etc/grafana/provisioning/alerting/storage-safety.yml:ro
      - ${QT_CLOCK_ALERT_TEST_RULE_FILE:?test rule required}:/etc/grafana/provisioning/alerting/clock-safety.yml:ro

volumes:
  loki-data:
  grafana-data:
