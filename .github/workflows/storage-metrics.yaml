name: Storage Metrics Qualification

# Focused disposable proof; the full required release matrix remains authoritative.
on:
  workflow_dispatch:
  push:
    branches: ['feature/**', 'hotfix/**']
    paths:
      - '.github/workflows/storage-metrics.yaml'
      - 'portal/backend/db/storage_metrics_schema.py'
      - 'portal/backend/service/storage/metrics.py'
      - 'scripts/db/*storage_metrics*'
      - 'scripts/ci/qualify_storage_metrics_grafana.py'
      - 'docker/grafana/storage-metrics/**'
      - 'tests/test_portal/test_storage_metrics.py'
      - 'tests/test_portal/test_storage_retention_observability_db.py'

permissions:
  contents: read

concurrency:
  group: storage-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Qualify bounded storage queries with disposable PostgreSQL
        env:
          QT_DISABLE_DOTENV: '1'
        run: |
          ./scripts/ci/run_test_suite.sh db tests/test_portal/test_storage_metrics.py tests/test_portal/test_storage_retention_observability_db.py

  storage-grafana:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:15.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-storage-ci-postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 24
      grafana:
        image: grafana/grafana:13.2.0
        env:
          GF_SECURITY_ADMIN_USER: admin
          GF_SECURITY_ADMIN_PASSWORD: synthetic-storage-ci-grafana
          GF_USERS_ALLOW_SIGN_UP: 'false'
          GF_ANALYTICS_REPORTING_ENABLED: 'false'
          GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -q -O - http://127.0.0.1:3000/api/health"
          --health-interval 5s --health-timeout 5s --health-retries 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated proof dependencies
        run: python -m pip install psycopg2-binary==2.9.10 PyYAML==6.0.2
      - name: Prove restricted pooled Grafana queries and cancellation
        env:
          PG_DSN: postgresql://postgres:synthetic-storage-ci-postgres@127.0.0.1:5432/postgres
          QT_TEST_GRAFANA_PASSWORD: synthetic-storage-ci-grafana
        run: >-
          python scripts/ci/qualify_storage_metrics_grafana.py --confirm-disposable
          --grafana-url http://127.0.0.1:3000 --grafana-postgres-host postgres:5432
