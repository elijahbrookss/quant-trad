name: Tests with Coverage

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  pr-suite:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock
          python -m pip check

      - name: Run PR suite
        run: ./scripts/ci/run_test_suite.sh pr

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install pinned frontend dependencies
        run: npm --prefix portal/frontend ci

      - name: Test and build production frontend
        run: make frontend-check

  deployment-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate disposable operator environment
        env:
          QT_SINGLE_NODE_ENV_FILE: ${{ github.workspace }}/secrets.env
        run: bash scripts/automation/server_deploy.sh init-env

      - name: Validate shell and Compose contracts
        run: |
          bash -n scripts/automation/server_deploy.sh
          bash -n scripts/automation/server_host_bootstrap.sh
          revision="$(git rev-parse HEAD)"
          tree_hash="$(
            python3 scripts/provenance/source_tree_hash.py \
              --root . \
              --git-revision "$revision"
          )"
          export QT_RELEASE_REVISION="$revision"
          export QT_SOURCE_TREE_HASH="$tree_hash"
          docker compose \
            --env-file secrets.env \
            --file docker/docker-compose.server.yml \
            config --quiet

      - name: Prove Grafana email notification path
        run: bash scripts/ci/test_grafana_email_alerting.sh

      - name: Prove physical storage alert queries and thresholds
        run: python3 scripts/ci/test_storage_alerts.py

      - name: Build production images with source attestation
        run: |
          revision="$(git rev-parse HEAD)"
          tree_hash="$(
            python3 scripts/provenance/source_tree_hash.py \
              --root . \
              --git-revision "$revision"
          )"
          export QT_RELEASE_REVISION="$revision"
          export QT_SOURCE_TREE_HASH="$tree_hash"
          docker compose \
            --env-file secrets.env \
            --file docker/docker-compose.server.yml \
            build tsdb backend frontend frontend-v2

      - name: Prove production worker encrypted pairing and dependency retirement
        run: |
          revision="$(git rev-parse HEAD)"
          tree_hash="$(python3 scripts/provenance/source_tree_hash.py --root . --git-revision "$revision")"
          docker build --file portal/backend/Dockerfile --target storage-test \
            --build-arg QT_SOURCE_REVISION="$revision" --build-arg QT_SOURCE_TREE_HASH="$tree_hash" \
            --tag qt-incremental-runtime-proof .
          docker run --rm --network none --user postgres --cpus 2 --memory 2g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env QT_DISABLE_DOTENV=1 --env PYTHONPATH=/app/src:/app \
            qt-incremental-runtime-proof \
            python /app/scripts/ci/rehearse_incremental_runtime.py \
            --pg-bin /usr/lib/postgresql/15/bin --pgbackrest /usr/local/bin/pgbackrest \
            --restic /usr/local/bin/restic

      - name: Prove online worker reads legacy archives without changing ownership
        run: python3 scripts/ci/rehearse_online_worker.py --image qt-incremental-runtime-proof
      - name: Prove confined online worker launch and refusal
        run: python3 -m scripts.ci.rehearse_online_launch --image qt-incremental-runtime-proof

      - name: Prove encrypted restore through actual QT current and frozen readers
        run: ./scripts/ci/run_test_suite.sh incremental-recovery

      - name: Prove bounded online copy and protected exact switch with concurrent intake
        run: ./scripts/ci/run_test_suite.sh storage-demo tests/test_market_data/test_fact_header_online_db.py tests/test_market_data/test_fact_header_online_proof_db.py tests/test_market_data/test_archive_online_copy_db.py tests/test_market_data/test_fact_header_online_references_db.py tests/test_market_data/test_fact_header_cancel_db.py tests/test_market_data/test_storage_online_controller_db.py

      - name: Recreate actual QT core on disposable storage without provider egress
        run: python3 scripts/ci/test_server_core_recreation.py

      - name: Prove fixed SSD/HDD runtime and held preserving cutover
        run: |
          python3 scripts/ci/test_server_core_recreation.py --storage-layout
          docker pull python:3.12.3-slim
          revision="$(git rev-parse HEAD)"
          python3 scripts/ci/test_storage_database_preparation.py \
            --runtime-images qt-incremental-runtime-proof \
            "quanttrad-frontend:$revision" "quanttrad-frontend-v2:$revision"

  deployment-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rehearse promotion and failed rollout recovery
        run: python3 scripts/ci/test_server_promotion.py

  clean-database-bootstrap:
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_DB: quanttrad_bootstrap
          POSTGRES_USER: quanttrad
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quanttrad -d quanttrad_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock
          python -m pip check

      - name: Prepare isolated database contracts
        run: |
          docker exec "${{ job.services.timescaledb.id }}" \
            psql -v ON_ERROR_STOP=1 -U quanttrad -d quanttrad_bootstrap \
            -c "ALTER SYSTEM SET timescaledb.telemetry_level = 'off'" \
            -c "SELECT pg_reload_conf()"
          docker exec "${{ job.services.timescaledb.id }}" \
            createdb -U quanttrad quanttrad_contracts
          for database in quanttrad_bootstrap quanttrad_contracts; do
            docker exec "${{ job.services.timescaledb.id }}" \
              psql -v ON_ERROR_STOP=1 -U quanttrad -d "$database" \
              -c "CREATE EXTENSION IF NOT EXISTS timescaledb" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          done

      - name: Prove clean current-schema bootstrap
        env:
          PG_DSN: postgresql+psycopg2://quanttrad@127.0.0.1:5432/quanttrad_bootstrap
          QT_CLEAN_BOOTSTRAP_TEST_DSN: postgresql+psycopg2://quanttrad@127.0.0.1:5432/quanttrad_bootstrap
          RUN_DB_TESTS: '1'
          QT_DB_TEST_ISOLATED: '1'
          QT_LOGGING_LOKI_URL: ''
          QT_LOGGING_DEBUG: 'false'
        run: python -m pytest -q tests/test_portal/test_clean_database_bootstrap_db.py

      - name: Verify PostgreSQL filesystem namespace
        run: ./scripts/ci/run_test_suite.sh db tests/test_market_data/test_header_namespace_db.py

      - name: Prove encrypted incremental database and archive recovery
        run: |
          docker build --file docker/test/incremental-recovery.Dockerfile \
            --tag qt-incremental-recovery-proof .
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            qt-incremental-recovery-proof

      - name: Run PostgreSQL-backed contract tests
        env:
          PG_DSN: postgresql+psycopg2://quanttrad@127.0.0.1:5432/quanttrad_contracts
          RUN_DB_TESTS: '1'
          QT_DB_TEST_ISOLATED: '1'
          QT_LOGGING_LOKI_URL: ''
          QT_LOGGING_DEBUG: 'false'
        run: >-
          python -m pytest -q -m db
          --ignore=tests/test_portal/test_clean_database_bootstrap_db.py
          --ignore=tests/test_market_data/test_header_namespace_db.py
