name: Tests with Coverage

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      force_full:
        description: 'Run complete qualification (work branches included)'
        type: boolean
        default: true
  push:
    branches: [develop, main, 'feature/**', 'hotfix/**']
  pull_request:
    branches: [develop, main]

# Keep the final integrated work-branch run; preserve develop/main run behavior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/feature/') || startsWith(github.ref, 'refs/heads/hotfix/') || (github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'hotfix/'))) }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      docs: ${{ steps.select.outputs.docs }}
      pr-suite: ${{ steps.select.outputs.pr-suite }}
      frontend: ${{ steps.select.outputs.frontend }}
      deployment-contract: ${{ steps.select.outputs.deployment-contract }}
      deployment-rehearsal: ${{ steps.select.outputs.deployment-rehearsal }}
      clean-database-bootstrap: ${{ steps.select.outputs.clean-database-bootstrap }}
      committed-recovery: ${{ steps.select.outputs.committed-recovery }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          QT_CI_INTEGRATION_REF: origin/develop
        run: python3 scripts/ci/ci_impact.py

  docs:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install --no-deps -r requirements.lock
      - run: |
          python scripts/docs/build_architecture_index.py --check
          QT_OMIT_DB_TESTS=1 python -m pytest -q tests/contract/test_architecture_docs_index.py tests/contract/test_documentation_integrity.py tests/contract/test_platform_glossary.py

  ci-required:
    if: ${{ always() }}
    needs: [changes, docs, pr-suite, frontend, deployment-contract, deployment-rehearsal, clean-database-bootstrap, committed-recovery]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Enforce computed required checks
        env:
          QT_CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/ci_impact.py --gate

  committed-recovery:
    needs: changes
    if: ${{ needs.changes.outputs['committed-recovery'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_RECOVERY_FIXTURE_ROOT: /tmp/qt-committed-recovery
    strategy:
      fail-fast: false
      matrix:
        runtime: [current, '24357ff387776822f676ae2a8b1cce7f209c313e']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install isolated operator dependencies
        run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip check
      - name: Prepare an accessible private operator workspace
        run: |
          test ! -e "$QT_RECOVERY_FIXTURE_ROOT"
          sudo install -d -o 1000 -g 1000 -m 0700 "$QT_RECOVERY_FIXTURE_ROOT" \
            "$QT_RECOVERY_FIXTURE_ROOT/source" "$QT_RECOVERY_FIXTURE_ROOT/evidence" "$QT_RECOVERY_FIXTURE_ROOT/history"
          git archive HEAD | sudo tar -x -C "$QT_RECOVERY_FIXTURE_ROOT/source"
          sudo chown -R 1000:1000 "$QT_RECOVERY_FIXTURE_ROOT/source"
          compose_plugin="$(docker info --format '{{json .ClientInfo.Plugins}}' | python -c \
            'import json,sys; print(next(p["Path"] for p in json.load(sys.stdin) if p["Name"] == "compose"))')"
          test -f "$compose_plugin"
          sudo install -d -o 1000 -g 1000 -m 0700 \
            "$QT_RECOVERY_FIXTURE_ROOT/docker-config" "$QT_RECOVERY_FIXTURE_ROOT/docker-config/cli-plugins"
          sudo install -o 1000 -g 1000 -m 0700 "$compose_plugin" \
            "$QT_RECOVERY_FIXTURE_ROOT/docker-config/cli-plugins/docker-compose"
          sudo setpriv --reuid=1000 --regid=1000 --groups="$(stat -c %g /var/run/docker.sock)" \
            env QT_DISABLE_DOTENV=1 "$(command -v python)" \
            "$QT_RECOVERY_FIXTURE_ROOT/source/scripts/ci/rehearse_online_prepared.py" --help >/dev/null
          sudo setpriv --reuid=1000 --regid=1000 --groups="$(stat -c %g /var/run/docker.sock)" \
            env DOCKER_CONFIG="$QT_RECOVERY_FIXTURE_ROOT/docker-config" docker info --format '{{.ServerVersion}}'
          sudo setpriv --reuid=1000 --regid=1000 --groups="$(stat -c %g /var/run/docker.sock)" \
            env DOCKER_CONFIG="$QT_RECOVERY_FIXTURE_ROOT/docker-config" docker compose version
      - name: Build current or first-release runtime and guarded fixture
        env:
          RUNTIME_REF: ${{ matrix.runtime }}
        run: |
          revision="$RUNTIME_REF"
          if [[ "$revision" == current ]]; then revision="$(git rev-parse HEAD)"; fi
          source_root="$RUNNER_TEMP/recovery-runtime-source"
          mkdir "$source_root"
          git archive "$revision" | tar -x -C "$source_root"
          tree_hash="$(python scripts/provenance/source_tree_hash.py --root "$source_root")"
          docker build --file "$source_root/portal/backend/Dockerfile" --target storage-test \
            --build-arg QT_SOURCE_REVISION="$revision" --build-arg QT_SOURCE_TREE_HASH="$tree_hash" \
            --tag qt-committed-recovery-runtime "$source_root"
          docker build --file docker/postgres/Dockerfile --tag quanttrad-postgres:2.14.2-pg15 .
          # Reproduce the actual retained image's missing tool without changing PG.
          printf 'FROM quanttrad-postgres:2.14.2-pg15\nRUN rm /usr/local/bin/pgbackrest\n' > "$RUNNER_TEMP/Dockerfile.missing-archiver"
          docker build --file "$RUNNER_TEMP/Dockerfile.missing-archiver" --tag qt-postgres-missing-archiver .
          cat > "$RUNNER_TEMP/Dockerfile.recovery-guard" <<'DOCKERFILE'
          FROM qt-committed-recovery-runtime
          LABEL qt.guarded-source-fixture=true
          COPY scripts/ci/online_guarded_source_fixture.py /app/portal/backend/run_backend.py
          COPY scripts/ci/online_guarded_source_fixture.py /app/portal/backend/workers/single_node_initializer.py
          COPY scripts/ci/online_guarded_source_fixture.py /app/portal/backend/workers/market_data_collector.py
          DOCKERFILE
          docker build --file "$RUNNER_TEMP/Dockerfile.recovery-guard" --tag qt-committed-recovery-guard .
      - name: Recover missing configuration and missing database archiver after actual expiry
        env:
          QT_DISABLE_DOTENV: '1'
        run: |
          history_root="$QT_RECOVERY_FIXTURE_ROOT/history"
          sudo mount -t tmpfs -o "size=6G,nosuid,nodev,mode=0700,uid=1000,gid=1000" tmpfs "$history_root"
          trap 'sudo umount "$history_root"' EXIT
          # The private application spool deliberately belongs to UID/GID 1000.
          # Match that unprivileged operator in the fixture; grant only Docker's
          # existing socket group, without changing runtime admission or modes.
          sudo setpriv --reuid=1000 --regid=1000 --groups="$(stat -c %g /var/run/docker.sock)" \
            env QT_DISABLE_DOTENV=1 DOCKER_CONFIG="$QT_RECOVERY_FIXTURE_ROOT/docker-config" \
            bash -c 'cd "$1"; shift; exec "$@"' _ \
            "$QT_RECOVERY_FIXTURE_ROOT/source" "$(command -v python)" scripts/ci/rehearse_online_prepared.py \
            --image qt-committed-recovery-runtime --database-image qt-postgres-missing-archiver \
            --archiver-replacement-image quanttrad-postgres:2.14.2-pg15 \
            --output-root "$QT_RECOVERY_FIXTURE_ROOT/evidence" --history-parent "$history_root" --require-distinct-devices \
            --prepare-source --worker-phases --initial-capture --final-pause --final-delta --switch-entry \
            --close-logins success --commit-switch --guarded-source-image qt-committed-recovery-guard \
            --recovery-mounts --recovery-repositories --recovery-spool --recovery-runtime \
            --operation-driver --full-operation --repository-config-failure --completion-observation
      - name: Attest and pack disposable qualification evidence
        if: always()
        env:
          RUNTIME_REF: ${{ matrix.runtime }}
        run: |
          # Preserve partial failure evidence even when attestation cannot complete.
          trap 'sudo tar -C "$QT_RECOVERY_FIXTURE_ROOT/evidence" -czf "$RUNNER_TEMP/committed-recovery.tar.gz" .' EXIT
          docker run --rm --network none --entrypoint cat qt-committed-recovery-runtime \
            /app/.qt-source-attestation.json > "$RUNNER_TEMP/runtime-source-attestation.json"
          python - "$RUNNER_TEMP/runtime-source-attestation.json" "$RUNNER_TEMP/qualification-source.json" <<'PY'
          import json, os, re, sys
          runtime = json.load(open(sys.argv[1]))
          expected = os.environ['GITHUB_SHA'] if os.environ['RUNTIME_REF'] == 'current' else os.environ['RUNTIME_REF']
          if runtime.get('source_revision') != expected or not re.fullmatch(r'[a-f0-9]{64}', runtime.get('source_tree_hash', '')):
              raise SystemExit('qualification_runtime_attestation_mismatch')
          with open(sys.argv[2], 'w') as destination:
              json.dump({'source_revision': os.environ['GITHUB_SHA'], 'workflow': '.github/workflows/test.yaml',
                         'run_id': int(os.environ['GITHUB_RUN_ID']), 'attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
                         'runtime_variant': os.environ['RUNTIME_REF'], 'runtime_attestation': runtime}, destination, sort_keys=True)
          PY
          sudo install -m 0644 "$RUNNER_TEMP/qualification-source.json" "$QT_RECOVERY_FIXTURE_ROOT/evidence/qualification-source.json"
      - name: Preserve disposable qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: committed-recovery-${{ matrix.runtime }}
          path: ${{ runner.temp }}/committed-recovery.tar.gz
          retention-days: 7

  pr-suite:
    needs: changes
    if: ${{ needs.changes.outputs['pr-suite'] == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock
          python -m pip check

      - name: Run PR suite
        run: ./scripts/ci/run_test_suite.sh pr

  frontend:
    needs: changes
    if: ${{ needs.changes.outputs['frontend'] == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal/frontend/package-lock.json

      - name: Install pinned frontend dependencies
        run: npm --prefix portal/frontend ci

      - name: Test and build production frontend
        run: make frontend-check

  deployment-proof-build:
    needs: changes
    if: ${{ needs.changes.outputs['deployment-contract'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable operator environment
        env:
          QT_SINGLE_NODE_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          QT_SERVER_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          TMPDIR: ${{ runner.temp }}
        run: |
          printf 'QT_SINGLE_NODE_ENV_FILE=%s\nQT_SERVER_ENV_FILE=%s\nTMPDIR=%s\n' \
            "$QT_SINGLE_NODE_ENV_FILE" "$QT_SERVER_ENV_FILE" "$TMPDIR" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/qt-disposable-operator"
          bash scripts/automation/server_deploy.sh init-env
      - name: Validate shell and Compose contracts
        run: |
          bash -n scripts/automation/server_deploy.sh
          bash -n scripts/automation/server_host_bootstrap.sh
          revision="$(git rev-parse HEAD)"
          tree_hash="$(
            python3 scripts/provenance/source_tree_hash.py \
              --root . \
              --git-revision "$revision"
          )"
          export QT_RELEASE_REVISION="$revision"
          export QT_SOURCE_TREE_HASH="$tree_hash"
          docker compose \
            --env-file "$QT_SINGLE_NODE_ENV_FILE" \
            --file docker/docker-compose.server.yml \
            config --quiet
          docker compose \
            --env-file "$QT_SINGLE_NODE_ENV_FILE" \
            --file docker/docker-compose.server.yml \
            --file docker/docker-compose.clock-health.yml \
            config --quiet
      - name: Build production images with source attestation
        run: |
          revision="$(git rev-parse HEAD)"
          tree_hash="$(
            python3 scripts/provenance/source_tree_hash.py \
              --root . \
              --git-revision "$revision"
          )"
          export QT_RELEASE_REVISION="$revision"
          export QT_SOURCE_TREE_HASH="$tree_hash"
          docker compose \
            --env-file "$QT_SINGLE_NODE_ENV_FILE" \
            --file docker/docker-compose.server.yml \
            build tsdb backend frontend frontend-v2
      - name: Build shared attested proof runtimes
        run: |
          revision="$(git rev-parse HEAD)"
          tree_hash="$(python3 scripts/provenance/source_tree_hash.py --git-revision "$revision")"
          for target in production storage-test; do
            tag=qt-terminal-runtime-proof
            if [[ "$target" == storage-test ]]; then tag=qt-incremental-runtime-proof; fi
            docker build --file portal/backend/Dockerfile --target "$target" \
              --build-arg QT_SOURCE_REVISION="$revision" --build-arg QT_SOURCE_TREE_HASH="$tree_hash" --tag "$tag" .
          done
          docker pull timescale/timescaledb:2.14.2-pg15
          python3 scripts/ci/deployment_proofs.py pack --root "$RUNNER_TEMP/deployment-proof-images"
      - name: Preserve source-bound proof images and exact node plan
        uses: actions/upload-artifact@v4
        with:
          name: deployment-proof-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  deployment-proof-alerts:
    needs:
      - changes
      - deployment-proof-build
    if: ${{ needs.changes.outputs['deployment-contract'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable operator environment
        env:
          QT_SINGLE_NODE_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          QT_SERVER_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          TMPDIR: ${{ runner.temp }}
        run: |
          printf 'QT_SINGLE_NODE_ENV_FILE=%s\nQT_SERVER_ENV_FILE=%s\nTMPDIR=%s\n' \
            "$QT_SINGLE_NODE_ENV_FILE" "$QT_SERVER_ENV_FILE" "$TMPDIR" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/qt-disposable-operator"
          bash scripts/automation/server_deploy.sh init-env
      - uses: actions/download-artifact@v4
        with:
          name: deployment-proof-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof-images
      - name: Verify and load exact proof image IDs
        run: python3 scripts/ci/deployment_proofs.py load --root "$RUNNER_TEMP/deployment-proof-images"
      - name: Run complete isolated proof group
        env:
          QT_PROOF_GROUP: alerts
        run: python3 scripts/ci/deployment_proofs.py run --root "$RUNNER_TEMP/deployment-proof-images" --group "$QT_PROOF_GROUP"
          --evidence "$RUNNER_TEMP/proof-evidence/$QT_PROOF_GROUP"
      - name: Preserve complete or partial proof diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-proof-result-alerts-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-evidence/
          retention-days: 7
          if-no-files-found: warn
  deployment-proof-lifecycle:
    needs:
      - changes
      - deployment-proof-build
    if: ${{ needs.changes.outputs['deployment-contract'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable operator environment
        env:
          QT_SINGLE_NODE_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          QT_SERVER_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          TMPDIR: ${{ runner.temp }}
        run: |
          printf 'QT_SINGLE_NODE_ENV_FILE=%s\nQT_SERVER_ENV_FILE=%s\nTMPDIR=%s\n' \
            "$QT_SINGLE_NODE_ENV_FILE" "$QT_SERVER_ENV_FILE" "$TMPDIR" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/qt-disposable-operator"
          bash scripts/automation/server_deploy.sh init-env
      - uses: actions/download-artifact@v4
        with:
          name: deployment-proof-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof-images
      - name: Verify and load exact proof image IDs
        run: python3 scripts/ci/deployment_proofs.py load --root "$RUNNER_TEMP/deployment-proof-images"
      - name: Run complete isolated proof group
        env:
          QT_PROOF_GROUP: lifecycle
        run: python3 scripts/ci/deployment_proofs.py run --root "$RUNNER_TEMP/deployment-proof-images" --group "$QT_PROOF_GROUP"
          --evidence "$RUNNER_TEMP/proof-evidence/$QT_PROOF_GROUP"
      - name: Preserve complete or partial proof diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-proof-result-lifecycle-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-evidence/
          retention-days: 7
          if-no-files-found: warn
  deployment-proof-restore:
    needs:
      - changes
      - deployment-proof-build
    if: ${{ needs.changes.outputs['deployment-contract'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable operator environment
        env:
          QT_SINGLE_NODE_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          QT_SERVER_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          TMPDIR: ${{ runner.temp }}
        run: |
          printf 'QT_SINGLE_NODE_ENV_FILE=%s\nQT_SERVER_ENV_FILE=%s\nTMPDIR=%s\n' \
            "$QT_SINGLE_NODE_ENV_FILE" "$QT_SERVER_ENV_FILE" "$TMPDIR" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/qt-disposable-operator"
          bash scripts/automation/server_deploy.sh init-env
      - uses: actions/download-artifact@v4
        with:
          name: deployment-proof-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof-images
      - name: Verify and load exact proof image IDs
        run: python3 scripts/ci/deployment_proofs.py load --root "$RUNNER_TEMP/deployment-proof-images"
      - name: Run complete isolated proof group
        env:
          QT_PROOF_GROUP: restore
        run: python3 scripts/ci/deployment_proofs.py run --root "$RUNNER_TEMP/deployment-proof-images" --group "$QT_PROOF_GROUP"
          --evidence "$RUNNER_TEMP/proof-evidence/$QT_PROOF_GROUP"
      - name: Preserve complete or partial proof diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-proof-result-restore-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-evidence/
          retention-days: 7
          if-no-files-found: warn
  deployment-proof-core:
    needs:
      - changes
      - deployment-proof-build
    if: ${{ needs.changes.outputs['deployment-contract'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable operator environment
        env:
          QT_SINGLE_NODE_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          QT_SERVER_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          TMPDIR: ${{ runner.temp }}
        run: |
          printf 'QT_SINGLE_NODE_ENV_FILE=%s\nQT_SERVER_ENV_FILE=%s\nTMPDIR=%s\n' \
            "$QT_SINGLE_NODE_ENV_FILE" "$QT_SERVER_ENV_FILE" "$TMPDIR" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/qt-disposable-operator"
          bash scripts/automation/server_deploy.sh init-env
      - uses: actions/download-artifact@v4
        with:
          name: deployment-proof-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof-images
      - name: Verify and load exact proof image IDs
        run: python3 scripts/ci/deployment_proofs.py load --root "$RUNNER_TEMP/deployment-proof-images"
      - name: Run complete isolated proof group
        env:
          QT_PROOF_GROUP: core
        run: python3 scripts/ci/deployment_proofs.py run --root "$RUNNER_TEMP/deployment-proof-images" --group "$QT_PROOF_GROUP"
          --evidence "$RUNNER_TEMP/proof-evidence/$QT_PROOF_GROUP"
      - name: Preserve complete or partial proof diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-proof-result-core-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-evidence/
          retention-days: 7
          if-no-files-found: warn
  deployment-proof-online:
    needs:
      - changes
      - deployment-proof-build
    if: ${{ needs.changes.outputs['deployment-contract'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate disposable operator environment
        env:
          QT_SINGLE_NODE_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          QT_SERVER_ENV_FILE: ${{ runner.temp }}/qt-disposable-operator/qt-disposable.env
          TMPDIR: ${{ runner.temp }}
        run: |
          printf 'QT_SINGLE_NODE_ENV_FILE=%s\nQT_SERVER_ENV_FILE=%s\nTMPDIR=%s\n' \
            "$QT_SINGLE_NODE_ENV_FILE" "$QT_SERVER_ENV_FILE" "$TMPDIR" >> "$GITHUB_ENV"
          install -d -m 0700 "$RUNNER_TEMP/qt-disposable-operator"
          bash scripts/automation/server_deploy.sh init-env
      - uses: actions/download-artifact@v4
        with:
          name: deployment-proof-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof-images
      - name: Verify and load exact proof image IDs
        run: python3 scripts/ci/deployment_proofs.py load --root "$RUNNER_TEMP/deployment-proof-images"
      - name: Run complete isolated proof group
        env:
          QT_PROOF_GROUP: online-${{ matrix.shard }}
        run: python3 scripts/ci/deployment_proofs.py run --root "$RUNNER_TEMP/deployment-proof-images" --group "$QT_PROOF_GROUP"
          --evidence "$RUNNER_TEMP/proof-evidence/$QT_PROOF_GROUP"
      - name: Preserve complete or partial proof diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: deployment-proof-result-online-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-evidence/
          retention-days: 7
          if-no-files-found: warn
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
  deployment-contract:
    needs:
      - changes
      - deployment-proof-build
      - deployment-proof-alerts
      - deployment-proof-lifecycle
      - deployment-proof-restore
      - deployment-proof-core
      - deployment-proof-online
    if: ${{ always() && needs.changes.outputs['deployment-contract'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require every independent proof job
        env:
          QT_PROOF_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          needs = json.loads(os.environ['QT_PROOF_NEEDS'])
          if not needs or any(row.get('result') != 'success' for row in needs.values()):
              raise SystemExit('incomplete deployment proof jobs')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: deployment-proof-images-${{ github.run_attempt }}
          path: ${{ runner.temp }}/deployment-proof-images
      - uses: actions/download-artifact@v4
        with:
          pattern: deployment-proof-result-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proof-receipts/
      - name: Verify and load exact proof image IDs
        run: python3 scripts/ci/deployment_proofs.py load --root "$RUNNER_TEMP/deployment-proof-images"
      - name: Attest complete deployment proof coverage
        run: python3 scripts/ci/deployment_proofs.py aggregate --root "$RUNNER_TEMP/deployment-proof-images" --evidence
          "$RUNNER_TEMP/proof-receipts"
      - name: Export qualified routine images
        run: python3 scripts/automation/release_package.py export --root "$RUNNER_TEMP/deployment-proof-images/release-package"
      - name: Preserve qualified routine images
        uses: actions/upload-artifact@v4
        with:
          name: routine-release-package
          path: ${{ runner.temp }}/deployment-proof-images/release-package/*
          retention-days: 7
          compression-level: 0

  deployment-rehearsal:
    needs: changes
    if: ${{ needs.changes.outputs['deployment-rehearsal'] == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set private disposable temporary root
        run: printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rehearse promotion and failed rollout recovery
        run: python3 scripts/ci/test_server_promotion.py
      - name: Rehearse actual routine package promotion and recovery
        run: python3 scripts/ci/test_server_promotion.py --routine --evidence-root "$RUNNER_TEMP/qt-routine-evidence"
      - name: Preserve disposable routine qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: routine-controller-rehearsal
          path: ${{ runner.temp }}/qt-routine-evidence/qualification.json
          retention-days: 7


  clean-database-bootstrap:
    needs: changes
    if: ${{ needs.changes.outputs['clean-database-bootstrap'] == 'true' }}
    runs-on: ubuntu-latest

    services:
      timescaledb:
        image: timescale/timescaledb:2.14.2-pg15
        env:
          POSTGRES_DB: quanttrad_bootstrap
          POSTGRES_USER: quanttrad
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quanttrad -d quanttrad_bootstrap"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r requirements.lock
          python -m pip check

      - name: Prepare isolated database contracts
        run: |
          docker exec "${{ job.services.timescaledb.id }}" \
            psql -v ON_ERROR_STOP=1 -U quanttrad -d quanttrad_bootstrap \
            -c "ALTER SYSTEM SET timescaledb.telemetry_level = 'off'" \
            -c "SELECT pg_reload_conf()"
          docker exec "${{ job.services.timescaledb.id }}" \
            createdb -U quanttrad quanttrad_contracts
          for database in quanttrad_bootstrap quanttrad_contracts; do
            docker exec "${{ job.services.timescaledb.id }}" \
              psql -v ON_ERROR_STOP=1 -U quanttrad -d "$database" \
              -c "CREATE EXTENSION IF NOT EXISTS timescaledb" \
              -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          done

      - name: Prove clean current-schema bootstrap
        env:
          PG_DSN: postgresql+psycopg2://quanttrad@127.0.0.1:5432/quanttrad_bootstrap
          QT_CLEAN_BOOTSTRAP_TEST_DSN: postgresql+psycopg2://quanttrad@127.0.0.1:5432/quanttrad_bootstrap
          RUN_DB_TESTS: '1'
          QT_DB_TEST_ISOLATED: '1'
          QT_LOGGING_LOKI_URL: ''
          QT_LOGGING_DEBUG: 'false'
        run: python -m pytest -q tests/test_portal/test_clean_database_bootstrap_db.py

      - name: Verify PostgreSQL filesystem namespace
        run: ./scripts/ci/run_test_suite.sh db tests/test_market_data/test_header_namespace_db.py

      - name: Prove encrypted incremental database and archive recovery
        run: |
          docker build --file docker/test/incremental-recovery.Dockerfile \
            --tag qt-incremental-recovery-proof .
          docker run --rm --network none --cpus 2 --memory 2g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            qt-incremental-recovery-proof

      - name: Run PostgreSQL-backed contract tests
        env:
          PG_DSN: postgresql+psycopg2://quanttrad@127.0.0.1:5432/quanttrad_contracts
          RUN_DB_TESTS: '1'
          QT_DB_TEST_ISOLATED: '1'
          QT_SCHEMA_TEMPLATE_PILOT: '1'
          QT_LOGGING_LOKI_URL: ''
          QT_LOGGING_DEBUG: 'false'
        run: |
          SOURCE_REVISION="$(git rev-parse HEAD)"
          SOURCE_TREE_HASH="$(python scripts/provenance/source_tree_hash.py --git-revision "$SOURCE_REVISION")"
          export SOURCE_REVISION SOURCE_TREE_HASH
          python -m pytest -q -m db \
            --ignore=tests/test_portal/test_clean_database_bootstrap_db.py \
            --ignore=tests/test_market_data/test_header_namespace_db.py

      - name: Prove frozen baseline refuses archive-generation reader floor
        env:
          PG_DSN: postgresql+psycopg2://quanttrad@127.0.0.1:5432/quanttrad_generation_floor
          QT_DISABLE_DOTENV: '1'
          QT_ARCHIVE_GENERATION_BASELINE_REVISION: 91d5a0564c0aa9e04159d6faaef670ae809fed60
        run: |
          baseline_root="$RUNNER_TEMP/archive-generation-baseline"
          baseline_image="qt-archive-generation-baseline:$QT_ARCHIVE_GENERATION_BASELINE_REVISION"
          mkdir "$baseline_root"
          git archive "$QT_ARCHIVE_GENERATION_BASELINE_REVISION" | tar -x -C "$baseline_root"
          baseline_tree="$(python scripts/provenance/source_tree_hash.py --root "$baseline_root")"
          docker build --file "$baseline_root/portal/backend/Dockerfile" --target production \
            --build-arg QT_SOURCE_REVISION="$QT_ARCHIVE_GENERATION_BASELINE_REVISION" \
            --build-arg QT_SOURCE_TREE_HASH="$baseline_tree" \
            --tag "$baseline_image" "$baseline_root"
          docker exec "${{ job.services.timescaledb.id }}" \
            createdb -U quanttrad quanttrad_generation_floor
          docker exec "${{ job.services.timescaledb.id }}" \
            psql -v ON_ERROR_STOP=1 -U quanttrad -d quanttrad_generation_floor \
            -c "CREATE EXTENSION IF NOT EXISTS timescaledb" \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto"
          probe=(docker run --rm --network host --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=64m \
            --tmpfs /app/logs:rw,nosuid,nodev,size=16m \
            --cpus 2 --memory 2g --pids-limit 128 \
            --cap-drop ALL --security-opt no-new-privileges \
            --env PG_DSN --env QT_DISABLE_DOTENV=1 --env QT_LOGGING_LOKI_URL= \
            --env QT_EXPECTED_SOURCE_REVISION="$QT_ARCHIVE_GENERATION_BASELINE_REVISION" \
            --mount "type=bind,source=$PWD/scripts/ci/prove_archive_generation_reader_floor.py,target=/qt-reader-floor-probe.py,readonly" \
            --entrypoint python "$baseline_image" /qt-reader-floor-probe.py)
          "${probe[@]}" --expect ready
          PYTHONPATH=src:. python -m scripts.db.manual_migration_fact_archive_generations_v1
          "${probe[@]}" --expect refused
